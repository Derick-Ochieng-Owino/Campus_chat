name: alma_mata
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  firebase_storage: ^13.0.5
  cloud_firestore: ^6.1.1
  firebase_messaging: ^16.0.4
  dio: ^5.9.0
  file_picker: ^10.3.7
  shared_preferences: ^2.5.3
  open_file: ^3.5.10
  path_provider: ^2.1.5
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  provider: ^6.1.5+1
  flutter_local_notifications: ^19.5.0
  intl: ^0.20.2
  image_picker: ^1.2.1
  uuid: ^4.4.0
  google_sign_in: ^6.1.0
  qr_flutter: ^4.1.0
  timezone: ^0.10.0
  flutter_timezone: ^5.1.0
  connectivity_plus: ^7.2.0
  lottie: ^3.2.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# FIX: Changed 'flutter_icons' to 'flutter_launcher_icons'
flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: true
  ios: true


# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/jkuat_logo.png
    - assets/images/logo.png
    - assets/data/campus_data.json
    - assets/images/onboarding_1.jpg
    - assets/images/onboarding_2.jpg
    - assets/images/onboarding_3.jpg
    - assets/images/onboarding_4.jpg
    - assets/images/onboarding_5.png
    - assets/images/dark.png
    - assets/images/light.png
    - assets/icons/google_logo.png
    - assets/images/jkuat_watermark.png


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

